name: Update Apple Music playlists

# Poll trusted main for completed music QA. No stage-1 push/PR/dispatch payload
# is authority. Deployment and the read-only Vault credential need approval.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: apple-music-playlists
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore private operation checkpoints
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apple-music-state
          key: apple-music-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apple-music-state-
      - name: Fetch trusted Vault and preflight complete QA queue
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VAULT_READ_TOKEN: ${{ secrets.MUSIC_VAULT_READ_TOKEN }}
        run: >-
          python scripts/music_delivery.py prepare --repo .
          --vault-root "$RUNNER_TEMP/authorized-vault"
          --plan "$RUNNER_TEMP/music-delivery-plan.json"
          --checkpoint "$RUNNER_TEMP/apple-music-state"
      - name: Recover missing checkpoint baseline with GETs only
        if: steps.preflight.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VAULT_READ_TOKEN: ${{ secrets.MUSIC_VAULT_READ_TOKEN }}
          APPLE_MUSIC_DEVELOPER_TOKEN: ${{ secrets.APPLE_MUSIC_DEVELOPER_TOKEN }}
          APPLE_MUSIC_USER_TOKEN: ${{ secrets.APPLE_MUSIC_USER_TOKEN }}
          APPLE_MUSIC_PLAYLIST_ID: p.YJXV7dEIeb3GzZX
        run: >-
          python scripts/music_delivery.py bootstrap --repo .
          --vault-root "$RUNNER_TEMP/authorized-vault" --plan "$RUNNER_TEMP/music-delivery-plan.json"
          --checkpoint "$RUNNER_TEMP/apple-music-state"
      - name: Reserve immutable operations before any writes
        if: steps.preflight.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VAULT_READ_TOKEN: ${{ secrets.MUSIC_VAULT_READ_TOKEN }}
        run: >-
          python scripts/music_delivery.py reserve --repo .
          --vault-root "$RUNNER_TEMP/authorized-vault" --plan "$RUNNER_TEMP/music-delivery-plan.json"
          --checkpoint "$RUNNER_TEMP/apple-music-state"
      - name: Persist write intents before any writes
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apple-music-state
          key: apple-music-state-${{ github.run_id }}-${{ github.run_attempt }}-intent
      - name: Confirm durable intent cache exists
        if: steps.preflight.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VAULT_READ_TOKEN: ${{ secrets.MUSIC_VAULT_READ_TOKEN }}
        run: >-
          python scripts/music_delivery.py confirm --repo .
          --vault-root "$RUNNER_TEMP/authorized-vault" --plan "$RUNNER_TEMP/music-delivery-plan.json"
          --checkpoint "$RUNNER_TEMP/apple-music-state"
      - name: Reverify live evidence and reconcile authorized dates
        if: steps.preflight.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VAULT_READ_TOKEN: ${{ secrets.MUSIC_VAULT_READ_TOKEN }}
          APPLE_MUSIC_DEVELOPER_TOKEN: ${{ secrets.APPLE_MUSIC_DEVELOPER_TOKEN }}
          APPLE_MUSIC_USER_TOKEN: ${{ secrets.APPLE_MUSIC_USER_TOKEN }}
          APPLE_MUSIC_PLAYLIST_ID: p.YJXV7dEIeb3GzZX
        run: >-
          python scripts/music_delivery.py run --repo .
          --vault-root "$RUNNER_TEMP/authorized-vault"
          --plan "$RUNNER_TEMP/music-delivery-plan.json"
          --checkpoint "$RUNNER_TEMP/apple-music-state" --execute
      - name: Preserve private checkpoints
        if: always() && steps.preflight.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apple-music-state
          key: apple-music-state-${{ github.run_id }}-${{ github.run_attempt }}-result
      - name: Remove private Vault input
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/authorized-vault"
