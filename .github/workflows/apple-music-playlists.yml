name: Update Apple Music playlists

# Explicit single-day entry; no cross-repository credentials or live CI dependency.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Single publication date (YYYY-MM-DD)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apple-music-playlists
  cancel-in-progress: false

jobs:
  publication-preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLICATION_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate full local history and regression tests
        run: |
          python scripts/validate.py
          python scripts/check_consistency.py --base-ref "$(git rev-parse HEAD^)"
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate explicit date and full music history
        run: >-
          python scripts/local_sync_gate.py --repo .
          --date "$PUBLICATION_DATE" --music-head "$GITHUB_SHA"
      - name: Restore private operation checkpoints
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apple-music-state
          key: apple-music-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apple-music-state-
      - name: Update only the authorized date
        env:
          APPLE_MUSIC_DEVELOPER_TOKEN: ${{ secrets.APPLE_MUSIC_DEVELOPER_TOKEN }}
          APPLE_MUSIC_USER_TOKEN: ${{ secrets.APPLE_MUSIC_USER_TOKEN }}
          APPLE_MUSIC_PLAYLIST_ID: p.YJXV7dEIeb3GzZX
          APPLE_MUSIC_API_HOST: amp-api.music.apple.com
        run: |
          python scripts/apple_music_sync.py --no-wrapper --execute --repo . --state-file "$RUNNER_TEMP/apple-music-state/total.json" --date "$PUBLICATION_DATE" --music-head "$GITHUB_SHA"
          python scripts/daily_playlists_sync.py --no-wrapper --execute --repo . --state-file "$RUNNER_TEMP/apple-music-state/days.json" --report "$RUNNER_TEMP/apple-music-report/dated-playlists.json" --date "$PUBLICATION_DATE" --music-head "$GITHUB_SHA"
      - name: Preserve private checkpoints
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apple-music-state
          key: apple-music-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save verified dated playlist index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dated-playlists
          path: ${{ runner.temp }}/apple-music-report/dated-playlists.json
          retention-days: 30
          if-no-files-found: warn
